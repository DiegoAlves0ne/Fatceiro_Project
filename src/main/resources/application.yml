spring:
  application:
    name: financeiro-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financeiro}
    username: ${DB_USER:financeiro}
    password: ${DB_PASSWORD:financeiro}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
