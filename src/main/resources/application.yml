spring:
  application:
    name: financeiro-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financeiro}
    username: ${DB_USER:financeiro}
    password: ${DB_PASSWORD:financeiro}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/clinica}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/clinica/protocol/openid-connect/certs}
          audiences:
            - ${KEYCLOAK_AUDIENCE:financeiro-api}
app:
  security:
    client-id: ${KEYCLOAK_AUDIENCE:financeiro-api}
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
